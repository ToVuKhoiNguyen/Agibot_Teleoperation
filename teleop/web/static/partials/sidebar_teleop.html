  <!-- RIGHT CONTROL SIDEBAR -->
  <div id="sidebar">

    <!-- PRESETS & SAFETY -->
    <div class="card">
      <h2>Presets</h2>
      <div class="btn-grid" style="margin:0; grid-template-columns:1fr 1fr; gap:5px;">
        <button onclick="sendCmd({cmd:'preset', pose:'home'})" title="Return both arms to canonical HOME posture">Home</button>
        <button onclick="sendCmd({cmd:'preset', pose:'up'})">Arms Up</button>
        <button onclick="sendCmd({cmd:'preset', pose:'tpose'})">T-Pose</button>
        <button onclick="sendCmd({cmd:'preset', pose:'forward'})">Arms Forward</button>
      </div>
      <div style="margin-top:5px;">
        <button onclick="sendCmd({cmd:'reset_objects'})" style="width:100%; background:#1c2d42; border:1px solid #365880;" title="Reset cac vat the ve vi tri ban dau trong mo phong">Reset vat the</button>
      </div>
    </div>

    <!-- DATA RECORDING (episodes written on this machine: robot.jsonl + teleop.jsonl + meta.json, no video) -->
    <div class="card">
      <h2>Data Recording <span id="rec_dot" style="display:none; color:#ff1744;">&#9679; REC</span></h2>
      <!-- 2 equal columns: task | instruction over Start REC | Discard last -->
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:5px; margin-bottom:5px;">
        <input type="text" id="rec_task" value="default" maxlength="48" placeholder="task" title="Task (folder name)" style="min-width:0; background:#111; color:#eee; border:1px solid #444; border-radius:4px; padding:6px; font-size:0.78rem;">
        <input type="text" id="rec_instruction" value="" maxlength="300" placeholder="instruction" title="Language instruction: what the robot should do" style="min-width:0; background:#111; color:#eee; border:1px solid #444; border-radius:4px; padding:6px; font-size:0.78rem;">
      </div>
      <div class="btn-grid" style="grid-template-columns:1fr 1fr; margin-bottom:0;">
        <button id="btn_rec" onclick="recToggle()" style="background:#5a1010; border-color:#c62828;">&#9679; Start REC</button>
        <button onclick="recDiscard()" title="Quest: B / Y = start/stop REC. Discard is only here, with the reason selected below">Discard last</button>
      </div>
      <select id="rec_discard_reason" onchange="sendCmd({cmd:'set_discard_reason', reason:this.value})" title="Why the episode is thrown away. Pick another reason and press Discard last again to change it" style="width:100%; margin-top:5px; background:#111; color:#eee; border:1px solid #444; border-radius:4px; padding:5px; font-size:0.78rem;">
        <option value="other">Discard reason: other</option>
      </select>
      <div id="rec_status" style="font-size:0.72rem; color:#9aa; margin-top:4px; line-height:1.35;">Not recording.</div>
      <a href="/dataset" target="_blank" title="Xem dataset LeRobot đã xuất (tab mới)" style="display:block; text-align:center; margin-top:8px; padding:9px 0; background:#16324f; color:#cfe8ff; border:1px solid #3d7ab8; border-radius:4px; font-size:0.9rem; font-weight:bold; text-decoration:none;">&#128193; Open Dataset</a>
    </div>

    <!-- QUEST CONTROLLER -> ROBOT SCALE -->
    <div class="card">
      <div class="slider-row" style="margin:0;" title="Controller moves 10 cm -> robot hand moves 10 cm x scale">
        <span style="color:#ffbc00; font-weight:bold;">Scale</span>
        <input type="range" id="slider_xr_scale" min="20" max="150" step="5" value="100">
        <span id="slider_xr_scale_val">1 : 1.00</span>
      </div>
    </div>

    <!-- LEFT ARM & HAND -->
    <div class="card">
      <h2>Left Arm & Hand</h2>
      <div class="slider-row">
        <span>XYZ Step:</span>
        <input type="range" id="step_xyz_l" min="1" max="10" value="2">
        <span id="step_xyz_l_val">2 cm</span>
      </div>
      <div class="btn-grid">
        <button class="repeatable" data-cmd='{"cmd":"arm_jog","arm":"left","axis":"x","dir":1}'>+X (Fwd)</button>
        <button class="repeatable" data-cmd='{"cmd":"arm_jog","arm":"left","axis":"y","dir":1}'>+Y (Left)</button>
        <button class="repeatable" data-cmd='{"cmd":"arm_jog","arm":"left","axis":"z","dir":1}'>+Z (Up)</button>
        <button class="repeatable" data-cmd='{"cmd":"arm_jog","arm":"left","axis":"x","dir":-1}'>-X (Back)</button>
        <button class="repeatable" data-cmd='{"cmd":"arm_jog","arm":"left","axis":"y","dir":-1}'>-Y (Right)</button>
        <button class="repeatable" data-cmd='{"cmd":"arm_jog","arm":"left","axis":"z","dir":-1}'>-Z (Down)</button>
      </div>
      <div class="slider-row">
        <span>RPY Step:</span>
        <input type="range" id="step_rpy_l" min="1" max="15" value="5">
        <span id="step_rpy_l_val">5°</span>
      </div>
      <div class="btn-grid">
        <button class="repeatable" data-cmd='{"cmd":"arm_jog","arm":"left","axis":"roll","dir":1}'>+Roll</button>
        <button class="repeatable" data-cmd='{"cmd":"arm_jog","arm":"left","axis":"pitch","dir":1}'>+Pitch</button>
        <button class="repeatable" data-cmd='{"cmd":"arm_jog","arm":"left","axis":"yaw","dir":1}'>+Yaw</button>
        <button class="repeatable" data-cmd='{"cmd":"arm_jog","arm":"left","axis":"roll","dir":-1}'>-Roll</button>
        <button class="repeatable" data-cmd='{"cmd":"arm_jog","arm":"left","axis":"pitch","dir":-1}'>-Pitch</button>
        <button class="repeatable" data-cmd='{"cmd":"arm_jog","arm":"left","axis":"yaw","dir":-1}'>-Yaw</button>
      </div>
      <div class="btn-grid" style="margin-top:6px;">
        <button onclick="sendCmd({cmd:'hand','arm':'left','action':'open'})">Open</button>
        <button onclick="sendCmd({cmd:'hand','arm':'left','action':'close'})">Close</button>
        <button onclick="sendCmd({cmd:'hand','arm':'left','action':'pinch'})">Pinch</button>
      </div>
      <div class="slider-row">
        <span>Hand Close:</span>
        <input type="range" id="slider_hand_l" min="0" max="100" value="0">
        <span id="slider_hand_l_val">0%</span>
      </div>
      <div class="slider-row" style="margin-top:4px;">
        <span>Thumb Open:</span>
        <input type="range" id="slider_thumb_open" min="0" max="2000" step="50" value="800">
        <span id="slider_thumb_open_val">800</span>
      </div>
    </div>

    <!-- RIGHT ARM & HAND -->
    <div class="card">
      <h2>Right Arm & Hand</h2>
      <div class="slider-row">
        <span>XYZ Step:</span>
        <input type="range" id="step_xyz_r" min="1" max="10" value="2">
        <span id="step_xyz_r_val">2 cm</span>
      </div>
      <div class="btn-grid">
        <button class="repeatable" data-cmd='{"cmd":"arm_jog","arm":"right","axis":"x","dir":1}'>+X (Fwd)</button>
        <button class="repeatable" data-cmd='{"cmd":"arm_jog","arm":"right","axis":"y","dir":1}'>+Y (Left)</button>
        <button class="repeatable" data-cmd='{"cmd":"arm_jog","arm":"right","axis":"z","dir":1}'>+Z (Up)</button>
        <button class="repeatable" data-cmd='{"cmd":"arm_jog","arm":"right","axis":"x","dir":-1}'>-X (Back)</button>
        <button class="repeatable" data-cmd='{"cmd":"arm_jog","arm":"right","axis":"y","dir":-1}'>-Y (Right)</button>
        <button class="repeatable" data-cmd='{"cmd":"arm_jog","arm":"right","axis":"z","dir":-1}'>-Z (Down)</button>
      </div>
      <div class="slider-row">
        <span>RPY Step:</span>
        <input type="range" id="step_rpy_r" min="1" max="15" value="5">
        <span id="step_rpy_r_val">5°</span>
      </div>
      <div class="btn-grid">
        <button class="repeatable" data-cmd='{"cmd":"arm_jog","arm":"right","axis":"roll","dir":1}'>+Roll</button>
        <button class="repeatable" data-cmd='{"cmd":"arm_jog","arm":"right","axis":"pitch","dir":1}'>+Pitch</button>
        <button class="repeatable" data-cmd='{"cmd":"arm_jog","arm":"right","axis":"yaw","dir":1}'>+Yaw</button>
        <button class="repeatable" data-cmd='{"cmd":"arm_jog","arm":"right","axis":"roll","dir":-1}'>-Roll</button>
        <button class="repeatable" data-cmd='{"cmd":"arm_jog","arm":"right","axis":"pitch","dir":-1}'>-Pitch</button>
        <button class="repeatable" data-cmd='{"cmd":"arm_jog","arm":"right","axis":"yaw","dir":-1}'>-Yaw</button>
      </div>
      <div class="btn-grid" style="margin-top:6px;">
        <button onclick="sendCmd({cmd:'hand','arm':'right','action':'open'})">Open</button>
        <button onclick="sendCmd({cmd:'hand','arm':'right','action':'close'})">Close</button>
        <button onclick="sendCmd({cmd:'hand','arm':'right','action':'pinch'})">Pinch</button>
      </div>
      <div class="slider-row">
        <span>Hand Close:</span>
        <input type="range" id="slider_hand_r" min="0" max="100" value="0">
        <span id="slider_hand_r_val">0%</span>
      </div>
      <div class="slider-row" style="margin-top:4px;">
        <span>Thumb Open:</span>
        <input type="range" id="slider_thumb_open_r" min="0" max="2000" step="50" value="800">
        <span id="slider_thumb_open_r_val">800</span>
      </div>
    </div>

    <!-- NECK POSTURE -->
    <div class="card">
      <h2>Neck Posture</h2>
      <div class="slider-row" style="margin:2px 0;">
        <span>Pitch:</span>
        <input type="range" id="slider_neck_pitch" min="-20" max="20" step="1" value="0">
        <span id="slider_neck_pitch_val">0°</span>
      </div>
      <div class="slider-row" style="margin:2px 0;">
        <span>Yaw:</span>
        <input type="range" id="slider_neck_yaw" min="-45" max="45" step="1" value="0">
        <span id="slider_neck_yaw_val">0°</span>
      </div>
      <div class="slider-row" style="margin:2px 0;">
        <span>Roll:</span>
        <input type="range" id="slider_neck_roll" min="-30" max="30" step="1" value="0">
        <span id="slider_neck_roll_val">0°</span>
      </div>
    </div>
